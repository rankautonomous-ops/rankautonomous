services:
  # Next.js Web Frontend
  - type: web
    name: rankautonomous-web
    env: node
    buildCommand: npm install && npm run build --workspace=web
    startCommand: npm run start --workspace=web
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false

  # Express API Backend
  - type: web
    name: rankautonomous-api
    env: node
    buildCommand: npm install && npm run build --workspace=@rankautonomous/api
    startCommand: npm run start:api
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AI_PROVIDER_API_KEY
        sync: false
      - key: PORT
        value: 4000

  # Node.js Background Worker
  - type: worker
    name: rankautonomous-worker
    env: node
    buildCommand: npm install && npm run build --workspace=@rankautonomous/api
    startCommand: npm run start:worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AI_PROVIDER_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
